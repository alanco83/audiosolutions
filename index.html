<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#020711">

  <title>Ángel Marrufo | Audio Solutions</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #020711;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* =========================
       MAIN CARD
    ========================== */

    .card {
      position: relative;

      width: 100%;
      max-width: 864px;

      overflow: hidden;

      background: #020711;
    }

    /* =========================
       TEMPLATE IMAGE
    ========================== */

    .card img {
      display: block;

      width: 100%;
      height: auto;

      user-select: none;
      -webkit-user-drag: none;
    }

    /* =========================
       CLICKABLE BUTTON AREAS
    ========================== */

    .tap {
      position: absolute;

      left: 5.5%;
      width: 89%;

      z-index: 10;

      border-radius: 28px;

      text-decoration: none;

      cursor: pointer;

      -webkit-tap-highlight-color:
        rgba(0, 140, 255, 0.18);
    }

    /* SAVE MY CONTACT */

    .save {
      top: 40.2%;
      height: 8.4%;
    }

    /* CALL ME */

    .call {
      top: 49.5%;
      height: 8.4%;
    }

    /* EMAIL ME */

    .email {
      top: 58.8%;
      height: 8.4%;
    }

    /* TEXT ME */

    .text {
      top: 68.1%;
      height: 8.4%;
    }

    /* SHARE MY CONTACT */

    .share {
      top: 77.4%;
      height: 8.4%;
    }

    /* Accessibility */

    .tap:focus-visible {
      outline: 3px solid #2aa8ff;
      outline-offset: -3px;
    }

    /* Desktop */

    @media (min-width: 900px) {

      body {
        padding: 20px 0;
      }

      .card {
        border-radius: 34px;

        box-shadow:
          0 18px 55px
          rgba(0, 0, 0, 0.55);
